<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Working research notes on building better AI tutors.">
  <title>Notes on building better AI tutors — Anand Grandhi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root { --blue:#0b63ff; --ink:#34384c; --muted:#6f7485; --faint:#9aa0ad; --line:#e3e6ec; --paper:#fff; --panel:#f7f8fb; --blue-soft:#e7efff; --yellow:#fff4cf; --green:#e8f4dd; --pink:#f4e1fb; }
    * { box-sizing:border-box; }
    html { background:var(--paper); scroll-behavior:smooth; }
    body { margin:0; color:var(--ink); background:var(--paper); font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; font-size:16px; line-height:1.58; -webkit-font-smoothing:antialiased; }
    button,a { font:inherit; } a { color:inherit; }
    .topbar { display:inline-flex; margin:12px 0 0 12px; background:rgba(255,255,255,.92); border-radius:7px; overflow:hidden; }
    .mark,.index-link { display:grid; min-height:56px; place-items:center; text-decoration:none; }
    .mark { width:70px; color:var(--blue); font-size:22px; font-weight:500; letter-spacing:-.08em; }
    .index-link { padding:0 24px 0 18px; color:var(--muted); font-size:13px; }
    .index-link:hover,.index-link:focus-visible { color:var(--blue); }
    .intro-wrap { max-width:770px; padding:118px 48px 104px; }
    .eyebrow { margin:0 0 42px; color:var(--muted); font-size:12px; }
    h1 { max-width:720px; margin:0; font-size:clamp(40px,4.5vw,62px); font-weight:400; letter-spacing:-.055em; line-height:1.08; }
    h1 em { color:var(--blue); font-style:normal; }
    .meta { max-width:570px; margin:30px 0 0; color:var(--muted); font-size:16px; line-height:1.72; }
    .intro { max-width:640px; margin:74px 0 0; padding-top:22px; border-top:1px solid var(--line); font-size:16px; line-height:1.72; }
    .topic-jump { padding:0 48px 42px; }
    .topic-jump-inner { max-width:1060px; padding-top:22px; border-top:1px solid var(--line); }
    .topic-jump-label { display:block; margin-bottom:14px; color:var(--muted); font-size:12px; }
    .topic-jump-links { display:flex; flex-wrap:wrap; gap:8px; }
    .topic-jump-links a { padding:5px 12px; background:var(--blue-soft); border-radius:999px; font-size:12px; text-decoration:none; }
    .topic-jump-links a:nth-child(2) { background:var(--yellow); }
    .topic-jump-links a:hover,.topic-jump-links a:focus-visible { color:var(--blue); }
    .reading-desk { display:grid; grid-template-columns:minmax(420px,47%) minmax(430px,53%); align-items:start; min-height:100vh; border-top:1px solid var(--line); }
    .question-index { padding:64px 48px 120px; }
    .index-heading { display:flex; justify-content:space-between; gap:16px; margin-bottom:50px; color:var(--muted); font-size:12px; }
    .topic { display:grid; grid-template-columns:50px minmax(0,1fr); gap:18px; padding:34px 0 48px; border-top:1px solid var(--line); scroll-margin-top:20px; }
    .topic-number { padding-top:4px; color:var(--faint); font-size:12px; font-variant-numeric:tabular-nums; }
    .topic h2 { margin:0; font-size:28px; font-weight:400; letter-spacing:-.04em; line-height:1.18; }
    .topic-description { max-width:500px; margin:9px 0 25px; color:var(--muted); font-size:15px; line-height:1.55; }
    .questions { border-top:1px solid var(--line); }
    .question-button { display:grid; grid-template-columns:minmax(0,1fr) auto 18px; gap:12px; align-items:center; width:100%; min-height:64px; padding:14px 4px 14px 0; border:0; border-bottom:1px solid var(--line); color:var(--ink); background:transparent; text-align:left; cursor:pointer; }
    .question-button:hover,.question-button:focus-visible,.question-button[aria-selected="true"] { color:var(--blue); }
    .question-button:focus-visible { outline:2px solid var(--blue); outline-offset:3px; }
    .question-text { font-size:16px; line-height:1.45; }
    .tag { display:inline-flex; padding:3px 10px; background:var(--blue-soft); border-radius:999px; color:var(--ink); font-size:12px; white-space:nowrap; }
    .question-button:nth-child(2) .tag { background:var(--yellow); }
    .arrow { font-size:18px; transition:transform 150ms ease; }
    .question-button[aria-selected="true"] .arrow { transform:translateX(3px); }
    .answer-side { position:sticky; top:0; height:100vh; border-left:1px solid var(--line); background:var(--panel); }
    .answer-panel { height:100%; overflow-y:auto; overscroll-behavior:contain; scrollbar-gutter:stable; }
    .answer-inner { max-width:760px; min-height:100%; padding:64px clamp(34px,4.3vw,72px) 58px; }
    .answer-top { display:flex; align-items:center; justify-content:space-between; gap:18px; margin-bottom:58px; }
    .answer-position { color:var(--muted); font-size:12px; }
    .close-answer { display:none; border:0; padding:8px; color:var(--ink); background:transparent; cursor:pointer; }
    .answer-tag { margin-bottom:20px; }
    .answer-title { margin:0 0 34px; font-size:clamp(30px,2.7vw,42px); font-weight:400; letter-spacing:-.05em; line-height:1.16; }
    .answer-copy > p { margin:0; font-size:16px; line-height:1.72; }
    .answer-copy > p + p { margin-top:20px; }
    .answer-nav { display:flex; justify-content:space-between; gap:16px; margin-top:66px; padding-top:18px; border-top:1px solid var(--line); }
    .answer-nav button { border:0; padding:6px 0; color:var(--muted); background:transparent; font-size:13px; cursor:pointer; }
    .answer-nav button:hover,.answer-nav button:focus-visible { color:var(--blue); }
    .answer-nav button:disabled { visibility:hidden; }
    .loading { color:var(--muted); }
    .note-error { padding:16px; border-left:2px solid var(--blue); color:var(--muted); }

    /* Public research-vault note */
    .research-note { color:var(--ink); }
    .research-note > blockquote:first-child { margin:0 0 30px; padding:13px 16px; border-left:3px solid var(--blue); background:var(--blue-soft); color:var(--ink); font-size:14px; line-height:1.55; }
    .research-note h2 { margin:42px 0 13px; padding-top:9px; border-top:1px solid var(--line); font-size:24px; font-weight:400; letter-spacing:-.03em; line-height:1.25; }
    .research-note h3 { margin:26px 0 8px; color:var(--ink); font-size:17px; font-weight:500; line-height:1.35; }
    .research-note p { margin:10px 0; font-size:15px; line-height:1.64; }
    .research-note ul,.research-note ol { margin:10px 0; padding-left:22px; }
    .research-note li { margin:6px 0; font-size:15px; line-height:1.55; }
    .research-note blockquote { margin:22px 0; padding:4px 0 4px 18px; border-left:2px solid var(--blue); font-size:18px; line-height:1.5; }
    .research-note blockquote p { font-size:inherit; line-height:inherit; }
    .research-note a { color:var(--blue); text-decoration-thickness:1px; text-underline-offset:3px; }
    .research-note strong { font-weight:500; }
    .research-note hr { margin:36px 0; border:0; border-top:1px solid var(--line); }
    .research-note table { display:block; width:100%; overflow-x:auto; margin:18px 0; border-collapse:collapse; font-size:13px; }
    .research-note th,.research-note td { min-width:120px; padding:10px 11px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; line-height:1.45; }
    .research-note th { color:var(--muted); font-weight:500; }
    .research-note pre { margin:18px 0; padding:16px; overflow-x:auto; background:var(--paper); border:1px solid var(--line); color:var(--ink); font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
    .research-note code { font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
    .research-note p code,.research-note li code { padding:2px 5px; background:var(--blue-soft); color:var(--ink); }
    footer { padding:54px 48px 34px; border-top:1px solid var(--line); color:var(--muted); }
    .footer-inner { width:min(100%,720px); margin-left:min(25vw,345px); }
    .footer-grid { display:grid; grid-template-columns:126px 1fr; gap:26px; }
    .footer-label { font-size:12px; }
    .footer-links { display:grid; gap:13px; }
    .footer-links a { display:grid; grid-template-columns:auto 1fr; gap:14px; align-items:center; color:var(--blue); text-decoration:none; }
    .footer-links a::after { content:""; height:1px; background:var(--line); }
    .closing { margin:60px 0 0 152px; color:var(--ink); font-size:16px; }
    .copyright { display:flex; justify-content:space-between; gap:20px; margin:28px 0 0 152px; padding-top:11px; border-top:1px solid var(--line); font-size:12px; }
    @media (max-width:900px) { .intro-wrap { padding:88px 24px 70px; } .topic-jump { padding:0 24px 34px; } .reading-desk { display:block; min-height:0; } .question-index { padding:52px 24px 90px; } .answer-side { position:fixed; inset:0; z-index:20; height:100dvh; border:0; visibility:hidden; opacity:0; transform:translateX(24px); transition:opacity 180ms ease,transform 180ms ease,visibility 180ms; } .answer-side.is-open { visibility:visible; opacity:1; transform:translateX(0); } .answer-inner { max-width:760px; margin:0 auto; padding:28px 24px 50px; } .answer-top { position:sticky; top:0; z-index:2; margin:-28px -24px 48px; padding:18px 24px; background:rgba(247,248,251,.96); border-bottom:1px solid var(--line); } .close-answer { display:inline-flex; } body.panel-open { overflow:hidden; } .footer-inner { margin-left:0; } }
    @media (max-width:520px) { .topbar { margin:8px 0 0 8px; } .mark { width:58px; } .index-link { padding-inline:16px; } h1 { font-size:clamp(38px,11vw,52px); } .intro { margin-top:60px; } .topic { grid-template-columns:1fr; gap:8px; padding:30px 0 40px; } .topic-number { padding:0; } .question-button { grid-template-columns:minmax(0,1fr) 18px; } .question-button .tag { display:none; } .research-note h2 { font-size:22px; } .research-note p,.research-note li { font-size:15px; } footer { padding:54px 24px 28px; } .footer-grid { grid-template-columns:1fr; } .closing,.copyright { margin-left:0; } }
  </style>
</head>
<body>
  <nav class="topbar" aria-label="Primary"><a class="mark" href="index.html" aria-label="Back to Anand Grandhi home">A.</a><a class="index-link" href="#topics">Topics</a></nav>
  <header class="intro-wrap"><p class="eyebrow" id="page-eyebrow"></p><h1 id="page-title"></h1><p class="meta" id="page-meta"></p><p class="intro" id="page-intro"></p></header>
  <nav class="topic-jump" aria-label="Jump to a topic"><div class="topic-jump-inner"><span class="topic-jump-label">Jump to a topic</span><div class="topic-jump-links" id="top-topics"></div></div></nav>
  <main class="reading-desk" id="topics"><div class="question-index"><div class="index-heading"><span>Topics and questions</span><span id="topic-count"></span></div><div id="topic-list"></div></div><aside class="answer-side" id="answer-side" aria-label="Selected answer"><div class="answer-panel" id="answer-panel"><article class="answer-inner"><div class="answer-top"><span class="answer-position" id="answer-position"></span><button class="close-answer" id="close-answer" type="button">Close</button></div><span class="tag answer-tag" id="answer-tag"></span><h2 class="answer-title" id="answer-title" tabindex="-1"></h2><div class="answer-copy" id="answer-copy"></div><nav class="answer-nav" aria-label="Answer navigation"><button type="button" id="previous-answer">← Previous</button><button type="button" id="next-answer">Next →</button></nav></article></div></aside></main>
  <footer><div class="footer-inner"><div class="footer-grid"><span class="footer-label">Explore</span><div class="footer-links" id="footer-topics"></div></div><p class="closing" id="page-footer"></p><div class="copyright"><span>Last revised <span id="page-revised"></span></span><span>© 2026 Anand Grandhi</span></div></div></footer>
  <script>
    fetch("content.json?v=" + Date.now(), { cache:"no-store" }).then(response => { if (!response.ok) throw new Error("Could not load the notes."); return response.json(); }).then(content => {
      const topicList=document.getElementById("topic-list"), footerTopics=document.getElementById("footer-topics"), topTopics=document.getElementById("top-topics"), answerSide=document.getElementById("answer-side"), answerPanel=document.getElementById("answer-panel"), answerTitle=document.getElementById("answer-title"), answerCopy=document.getElementById("answer-copy"), previousButton=document.getElementById("previous-answer"), nextButton=document.getElementById("next-answer");
      const mobileLayout=()=>window.matchMedia("(max-width:900px)").matches; const questionButtons=[]; let activeIndex=0;
      document.getElementById("page-eyebrow").textContent=content.eyebrow; document.getElementById("page-title").innerHTML=content.title.replace("better AI tutors","<em>better AI tutors</em>"); document.getElementById("page-meta").innerHTML=content.meta; document.getElementById("page-intro").textContent=content.intro; document.getElementById("page-revised").textContent=content.revised; document.getElementById("page-footer").textContent=content.footer; document.getElementById("topic-count").textContent=content.topics.length+" topics · "+content.questions.length+" notes";
      content.topics.forEach((topic,index)=>{ const section=document.createElement("section"), number=document.createElement("div"), body=document.createElement("div"), heading=document.createElement("h2"), description=document.createElement("p"), questions=document.createElement("div"); section.className="topic"; section.id=topic.id; number.className="topic-number"; number.textContent=String(index+1).padStart(2,"0"); heading.textContent=topic.title; description.className="topic-description"; description.textContent=topic.description; questions.className="questions"; content.questions.filter(entry=>topic.tags.includes(entry.tag)).forEach(entry=>{ const button=document.createElement("button"); button.type="button"; button.className="question-button"; button.dataset.questionId=entry.id; button.setAttribute("aria-selected","false"); button.innerHTML='<span class="question-text"></span><span class="tag"></span><span class="arrow" aria-hidden="true">→</span>'; button.querySelector(".question-text").textContent=entry.question; button.querySelector(".tag").textContent=entry.tag; button.addEventListener("click",()=>selectQuestion(content.questions.indexOf(entry),true)); questionButtons.push(button); questions.append(button); }); body.append(heading,description,questions); section.append(number,body); topicList.append(section); const topLink=document.createElement("a"); topLink.href="#"+topic.id; topLink.textContent=String(index+1).padStart(2,"0")+" · "+topic.title; topTopics.append(topLink); const footerLink=document.createElement("a"); footerLink.href="#"+topic.id; footerLink.textContent=topic.title; footerTopics.append(footerLink); });
      async function renderAnswer(entry){ answerCopy.replaceChildren(); if (!entry.contentUrl) { (entry.answer||[]).forEach(paragraph=>{ const p=document.createElement("p"); p.textContent=paragraph; answerCopy.append(p); }); return; } answerCopy.innerHTML='<p class="loading">Loading research note…</p>'; try { const response=await fetch(entry.contentUrl+"?v="+Date.now(),{cache:"no-store"}); if(!response.ok) throw new Error(); const note=await response.text(); if(content.questions[activeIndex].id!==entry.id) return; answerCopy.innerHTML='<div class="research-note">'+note+'</div>'; answerCopy.querySelectorAll('a[href^="http"]').forEach(link=>{link.target="_blank";link.rel="noreferrer";}); } catch { answerCopy.innerHTML='<p class="note-error">This research note could not be loaded. Please refresh the page.</p>'; } }
      function selectQuestion(index,userInitiated=false){ activeIndex=Math.max(0,Math.min(index,content.questions.length-1)); const entry=content.questions[activeIndex]; questionButtons.forEach(button=>button.setAttribute("aria-selected",String(button.dataset.questionId===entry.id))); document.getElementById("answer-position").textContent=String(activeIndex+1).padStart(2,"0")+" / "+String(content.questions.length).padStart(2,"0"); document.getElementById("answer-tag").textContent=entry.tag; answerTitle.textContent=entry.question; renderAnswer(entry); previousButton.disabled=activeIndex===0; nextButton.disabled=activeIndex===content.questions.length-1; answerPanel.scrollTop=0; history.replaceState(null,"","#"+entry.id); if(mobileLayout()&&userInitiated){ answerSide.classList.add("is-open"); document.body.classList.add("panel-open"); answerTitle.focus({preventScroll:true}); } }
      function closeAnswer(){ answerSide.classList.remove("is-open"); document.body.classList.remove("panel-open"); questionButtons.find(button=>button.dataset.questionId===content.questions[activeIndex].id)?.focus(); }
      previousButton.addEventListener("click",()=>selectQuestion(activeIndex-1)); nextButton.addEventListener("click",()=>selectQuestion(activeIndex+1)); document.getElementById("close-answer").addEventListener("click",closeAnswer); document.addEventListener("keydown",event=>{ if(event.key==="Escape"&&mobileLayout()&&answerSide.classList.contains("is-open")) closeAnswer(); }); const hashIndex=content.questions.findIndex(entry=>entry.id===location.hash.slice(1)); const startIndex=hashIndex>=0?hashIndex:Math.max(0,content.questions.findIndex(entry=>entry.id===content.defaultQuestion)); selectQuestion(startIndex);
    }).catch(error=>{document.getElementById("topic-list").textContent=error.message;});
  </script>
</body>
</html>
