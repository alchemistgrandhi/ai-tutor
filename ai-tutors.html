<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Working notes on the questions an AI tutor should answer before deciding how to teach.">
  <title>Notes on building better AI tutors — Anand Grandhi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: light; --blue:#0b63ff; --ink:#252b42; --muted:#6f7485; --faint:#9aa0ad; --line:#e3e6ec; --paper:#fff; --panel:#f7f8fb; --yellow:#fff4cf; --green:#e8f4dd; --pink:#f4e1fb; --peach:#ffe8d8; --blue-soft:#e7efff; }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; background: var(--paper); }
    body { margin:0; color:var(--ink); background:var(--paper); font-family:"Inter",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; font-size:16px; line-height:1.58; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; }
    button,a { font:inherit; } a { color:inherit; }
    .topbar { display:inline-flex; align-items:stretch; margin:12px 0 0 12px; border-radius:7px; background:rgba(255,255,255,.92); backdrop-filter:blur(12px); overflow:hidden; }
    .mark,.index-link { display:grid; place-items:center; min-height:56px; text-decoration:none; }
    .mark { width:70px; color:var(--blue); font-size:1.35rem; font-weight:500; letter-spacing:-.08em; }
    .index-link { padding:0 26px 0 20px; color:var(--muted); font-size:.82rem; font-weight:500; }
    .index-link:hover,.index-link:focus-visible { color:var(--blue); }
    .intro-wrap { max-width:720px; padding:118px 48px 112px; }
    .eyebrow { margin:0 0 42px; color:var(--muted); font-size:.75rem; font-weight:500; }
    h1 { max-width:680px; margin:0; font-size:clamp(2.2rem,4.5vw,3.85rem); font-weight:400; letter-spacing:-.05em; line-height:1.08; color:var(--ink); }
    h1 em { color:var(--blue); font-weight:400; }
    .meta { max-width:520px; margin:30px 0 0; color:var(--muted); font-size:.94rem; line-height:1.72; }
    .intro { max-width:610px; margin:78px 0 0; padding-top:22px; border-top:1px solid var(--line); color:var(--ink); font-size:1.05rem; line-height:1.72; }
    .topic-jump { padding:0 48px 42px; }
    .topic-jump-inner { max-width:1060px; padding-top:22px; border-top:1px solid var(--line); }
    .topic-jump-label { display:block; margin-bottom:15px; color:var(--muted); font-size:.76rem; }
    .topic-jump-links { display:flex; flex-wrap:wrap; gap:8px; }
    .topic-jump-links a { display:inline-flex; align-items:center; min-height:31px; padding:5px 13px; border-radius:999px; background:var(--blue-soft); color:var(--ink); font-size:.76rem; text-decoration:none; transition:transform 150ms ease,color 150ms ease; }
    .topic-jump-links a:nth-child(5n + 2) { background:var(--yellow); }
    .topic-jump-links a:nth-child(5n + 3) { background:var(--green); }
    .topic-jump-links a:nth-child(5n + 4) { background:var(--pink); }
    .topic-jump-links a:nth-child(5n + 5) { background:var(--peach); }
    .topic-jump-links a:hover,.topic-jump-links a:focus-visible { color:var(--blue); transform:translateY(-1px); }
    .topic-jump-links a:focus-visible { outline:2px solid var(--blue); outline-offset:2px; }
    .reading-desk { display:grid; grid-template-columns:minmax(430px,53%) minmax(390px,47%); align-items:start; border-top:1px solid var(--line); min-height:100vh; }
    .question-index { padding:64px 48px 120px; }
    .index-heading { display:flex; justify-content:space-between; gap:24px; margin-bottom:54px; color:var(--muted); font-size:.78rem; }
    .topic { display:grid; grid-template-columns:54px minmax(0,1fr); gap:18px; padding:34px 0 46px; border-top:1px solid var(--line); scroll-margin-top:20px; }
    .topic-number { padding-top:4px; color:var(--muted); font-size:.76rem; font-variant-numeric:tabular-nums; }
    .topic h2 { margin:0; font-size:clamp(1.3rem,2vw,1.75rem); font-weight:400; letter-spacing:-.035em; line-height:1.2; }
    .topic-description { max-width:520px; margin:8px 0 25px; color:var(--muted); font-size:.9rem; line-height:1.55; }
    .questions { border-top:1px solid var(--line); }
    .question-button { display:grid; grid-template-columns:minmax(0,1fr) auto 18px; gap:14px; align-items:center; width:100%; min-height:62px; padding:14px 6px 14px 0; border:0; border-bottom:1px solid var(--line); color:var(--ink); background:transparent; text-align:left; cursor:pointer; }
    .question-button:hover,.question-button:focus-visible,.question-button[aria-selected="true"] { color:var(--blue); }
    .question-button:focus-visible { outline:2px solid var(--blue); outline-offset:3px; }
    .question-button[aria-selected="true"] .arrow { transform:translateX(3px); }
    .question-text { font-size:.98rem; line-height:1.43; }
    .tag { padding:3px 11px; border-radius:999px; background:var(--blue-soft); color:var(--ink); font-size:.7rem; white-space:nowrap; }
    .question-button:nth-child(5n + 2) .tag { background:var(--yellow); }
    .question-button:nth-child(5n + 3) .tag { background:var(--green); }
    .question-button:nth-child(5n + 4) .tag { background:var(--pink); }
    .question-button:nth-child(5n + 5) .tag { background:var(--peach); }
    .arrow { font-size:1.1rem; transition:transform 150ms ease; }
    .answer-side { position:sticky; top:0; height:100vh; border-left:1px solid var(--line); background:var(--panel); }
    .answer-panel { height:100%; overflow-y:auto; overscroll-behavior:contain; scrollbar-gutter:stable; }
    .answer-inner { max-width:690px; min-height:100%; padding:64px clamp(34px,4.3vw,72px) 56px; }
    .answer-top { display:flex; align-items:center; justify-content:space-between; gap:20px; margin-bottom:70px; }
    .answer-position { color:var(--muted); font-size:.76rem; }
    .close-answer { display:none; border:0; padding:8px; color:var(--ink); background:transparent; cursor:pointer; }
    .answer-tag { display:inline-flex; margin-bottom:22px; }
    .answer-title { margin:0 0 36px; font-size:clamp(1.65rem,2.7vw,2.55rem); font-weight:400; letter-spacing:-.045em; line-height:1.18; }
    .answer-copy p { margin:0; color:var(--ink); font-size:1rem; line-height:1.72; }
    .answer-copy p+p { margin-top:20px; }
    .links { display:grid; gap:9px; justify-items:start; margin-top:28px; font-size:.82rem; }
    .links a { color:var(--blue); text-underline-offset:3px; }
    .answer-media { display:grid; gap:22px; margin-top:32px; }
    figure { margin:0; }
    .answer-media img { display:block; width:100%; height:auto; background:#eceef2; border:1px solid var(--line); }
    figcaption { margin-top:9px; color:var(--muted); font-size:.74rem; line-height:1.5; }
    .answer-nav { display:flex; justify-content:space-between; gap:16px; margin-top:70px; padding-top:18px; border-top:1px solid var(--line); }
    .answer-nav button { border:0; padding:6px 0; color:var(--muted); background:transparent; cursor:pointer; font-size:.78rem; }
    .answer-nav button:hover,.answer-nav button:focus-visible { color:var(--blue); }
    .answer-nav button:disabled { visibility:hidden; }
    .unassigned { margin-top:28px; padding:18px; border:1px dashed var(--line); color:var(--muted); font-size:.85rem; }
    footer { min-height:auto; padding:54px 48px 34px; color:var(--muted); background:var(--paper); border-top:1px solid var(--line); }
    .footer-inner { width:min(100%,720px); margin-left:min(25vw,345px); }
    .footer-grid { display:grid; grid-template-columns:126px 1fr; gap:26px; }
    .footer-label { color:var(--muted); font-size:.75rem; font-weight:500; font-style:normal; }
    .footer-links { display:grid; gap:13px; }
    .footer-links a { display:grid; grid-template-columns:auto 1fr; gap:14px; align-items:center; color:var(--blue); text-decoration:none; }
    .footer-links a::after { content:""; height:1px; background:var(--line); }
    .closing { margin:60px 0 0 152px; color:var(--ink); font-size:.98rem; font-style:normal; }
    .copyright { display:flex; justify-content:space-between; gap:20px; margin:28px 0 0 152px; padding-top:11px; border-top:1px solid var(--line); color:var(--muted); font-size:.7rem; }
    @media (max-width:900px) {
      .intro-wrap { padding:88px 24px 70px; }
      .topic-jump { padding:0 24px 34px; }
      .reading-desk { display:block; min-height:0; }
      .question-index { padding:52px 24px 90px; }
      .answer-side { position:fixed; inset:0; z-index:20; height:100dvh; border:0; visibility:hidden; opacity:0; transform:translateX(24px); transition:opacity 180ms ease,transform 180ms ease,visibility 180ms; }
      .answer-side.is-open { visibility:visible; opacity:1; transform:translateX(0); }
      .answer-inner { max-width:720px; margin:0 auto; padding:28px 24px 50px; }
      .answer-top { position:sticky; top:0; z-index:2; margin:-28px -24px 52px; padding:18px 24px; background:rgba(246,247,250,.95); backdrop-filter:blur(12px); border-bottom:1px solid var(--line); }
      .close-answer { display:inline-flex; }
      body.panel-open { overflow:hidden; }
      .footer-inner { margin-left:0; }
    }
    @media (max-width:520px) {
      .topbar { margin:8px 0 0 8px; } .mark { width:58px; } .index-link { padding-inline:16px; }
      h1 { font-size:clamp(2.25rem,11vw,3.2rem); } .intro { margin-top:60px; } .index-heading { margin-bottom:38px; }
      .topic { grid-template-columns:1fr; gap:8px; padding:30px 0 40px; } .topic-number { padding:0; }
      .question-button { grid-template-columns:minmax(0,1fr) 18px; } .question-button .tag { display:none; }
      footer { padding:54px 24px 28px; } .footer-grid { grid-template-columns:1fr; } .closing,.copyright { margin-left:0; }
    }
    @media (prefers-reduced-motion:reduce) { html { scroll-behavior:auto; } .answer-side,.arrow { transition:none; } }
  
/* Standardized type scale */
:root{
  --text-xs:12px;
  --text-sm:13px;
  --text-md:16px;
  --text-lg:18px;
  --title-sm:28px;
  --title-md:42px;
  --title-lg:62px;
}

body{
  font-size:var(--text-md);
  line-height:1.58;
}

h1{
  font-size:clamp(40px,4.5vw,var(--title-lg));
  line-height:1.08;
  letter-spacing:-0.055em;
  font-weight:400;
}

.topic h2{
  font-size:var(--title-sm);
  line-height:1.18;
  letter-spacing:-0.04em;
  font-weight:400;
}

.answer-title{
  font-size:clamp(30px,2.7vw,var(--title-md));
  line-height:1.16;
  letter-spacing:-0.05em;
  font-weight:400;
}

.meta,
.intro,
.topic-description,
.answer-copy p{
  font-size:var(--text-md);
  line-height:1.72;
}

.question-text{
  font-size:var(--text-md);
  line-height:1.45;
}

.index-link,
.links,
.answer-nav button{
  font-size:var(--text-sm);
  line-height:1.45;
  font-weight:500;
}

.eyebrow,
.topic-jump-label,
.index-heading,
.topic-number,
.answer-position,
.tag,
.topic-jump-links a,
.footer-label,
.copyright,
figcaption{
  font-size:var(--text-xs);
  line-height:1.45;
  font-weight:500;
}

.closing{
  font-size:var(--text-md);
  line-height:1.65;
}

@media (max-width:520px){
  h1{font-size:clamp(38px,11vw,52px);}
  .topic h2{font-size:24px;}
  .answer-title{font-size:30px;}
}

</style>
</head>
<body>
  <nav class="topbar" aria-label="Primary"><a class="mark" href="index.html" aria-label="Back to Anand Grandhi home">A.</a><a class="index-link" href="#topics">Topics</a></nav>
  <header class="intro-wrap" id="top"><p class="eyebrow" id="page-eyebrow"></p><h1 id="page-title"></h1><p class="meta" id="page-meta"></p><p class="intro" id="page-intro"></p></header>
  <nav class="topic-jump" aria-label="Jump to a topic"><div class="topic-jump-inner"><span class="topic-jump-label">Jump to a topic</span><div class="topic-jump-links" id="top-topics"></div></div></nav>
  <main class="reading-desk" id="topics">
    <div class="question-index"><div class="index-heading"><span>Topics and questions</span><span id="topic-count"></span></div><div id="topic-list"></div></div>
    <aside class="answer-side" id="answer-side" aria-label="Selected answer"><div class="answer-panel" id="answer-panel"><article class="answer-inner">
      <div class="answer-top"><span class="answer-position" id="answer-position"></span><button class="close-answer" id="close-answer" type="button" aria-label="Close answer">Close</button></div>
      <span class="tag answer-tag" id="answer-tag"></span><h2 class="answer-title" id="answer-title" tabindex="-1"></h2><div class="answer-copy" id="answer-copy"></div><div class="links" id="answer-links"></div><div class="answer-media" id="answer-media"></div>
      <nav class="answer-nav" aria-label="Answer navigation"><button type="button" id="previous-answer">← Previous</button><button type="button" id="next-answer">Next →</button></nav>
    </article></div></aside>
  </main>
  <footer><div class="footer-inner"><div class="footer-grid"><span class="footer-label">Explore</span><div class="footer-links" id="footer-topics"></div></div><p class="closing" id="page-footer"></p><div class="copyright"><span>Last revised <span id="page-revised"></span></span><span>© 2026 Anand Grandhi</span></div></div></footer>
  <script>
    fetch("content.json?v=" + Date.now(), { cache: "no-store" })
      .then(response => {
        if (!response.ok) throw new Error("Could not load the notes.");
        return response.json();
      })
      .then(content => {
    const topicList=document.getElementById("topic-list"),footerTopics=document.getElementById("footer-topics"),topTopics=document.getElementById("top-topics"),answerSide=document.getElementById("answer-side"),answerPanel=document.getElementById("answer-panel"),answerTitle=document.getElementById("answer-title"),answerCopy=document.getElementById("answer-copy"),answerLinks=document.getElementById("answer-links"),answerMedia=document.getElementById("answer-media"),previousButton=document.getElementById("previous-answer"),nextButton=document.getElementById("next-answer");
    const mobileLayout=()=>window.matchMedia("(max-width: 900px)").matches; let activeIndex=0;
    document.getElementById("page-eyebrow").textContent=content.eyebrow; document.getElementById("page-title").innerHTML=content.title.replace("better AI tutors","<em>better AI tutors</em>"); document.getElementById("page-meta").innerHTML=content.meta; document.getElementById("page-intro").textContent=content.intro; document.getElementById("page-revised").textContent=content.revised; document.getElementById("page-footer").textContent=content.footer; document.getElementById("topic-count").textContent=content.topics.length+" topics · "+content.questions.length+" questions";
    const questionButtons=[],assigned=new Set();
    content.topics.forEach((topic,index)=>{
      const section=document.createElement("section"); section.className="topic"; section.id=topic.id;
      const number=document.createElement("div"); number.className="topic-number"; number.textContent=String(index+1).padStart(2,"0");
      const body=document.createElement("div"),heading=document.createElement("h2"),description=document.createElement("p"),questions=document.createElement("div"); heading.textContent=topic.title; description.className="topic-description"; description.textContent=topic.description; questions.className="questions";
      content.questions.filter(entry=>topic.tags.includes(entry.tag)).forEach(entry=>{ assigned.add(entry.id); const button=document.createElement("button"); button.type="button"; button.className="question-button"; button.dataset.questionId=entry.id; button.setAttribute("aria-selected","false"); button.innerHTML='<span class="question-text"></span><span class="tag"></span><span class="arrow" aria-hidden="true">→</span>'; button.querySelector(".question-text").textContent=entry.question; button.querySelector(".tag").textContent=entry.tag; button.addEventListener("click",()=>selectQuestion(content.questions.indexOf(entry),true)); questionButtons.push(button); questions.append(button); });
      body.append(heading,description,questions); section.append(number,body); topicList.append(section); const footerLink=document.createElement("a"); footerLink.href="#"+topic.id; footerLink.textContent=topic.title; footerTopics.append(footerLink); const topLink=document.createElement("a"); topLink.href="#"+topic.id; topLink.textContent=String(index+1).padStart(2,"0")+" · "+topic.title; topTopics.append(topLink);
    });
    const unassigned=content.questions.filter(entry=>!assigned.has(entry.id)); if(unassigned.length){ const warning=document.createElement("div"); warning.className="unassigned"; warning.textContent=unassigned.length+" question(s) need a matching topic tag in content.js."; topicList.append(warning); }
    function selectQuestion(index,userInitiated=false){
      activeIndex=Math.max(0,Math.min(index,content.questions.length-1)); const entry=content.questions[activeIndex]; questionButtons.forEach(button=>button.setAttribute("aria-selected",String(button.dataset.questionId===entry.id))); document.getElementById("answer-position").textContent=String(activeIndex+1).padStart(2,"0")+" / "+String(content.questions.length).padStart(2,"0"); document.getElementById("answer-tag").textContent=entry.tag; answerTitle.textContent=entry.question; answerCopy.replaceChildren(); entry.answer.forEach(paragraph=>{const p=document.createElement("p");p.textContent=paragraph;answerCopy.append(p);});
      answerLinks.replaceChildren(); (entry.links||[]).forEach(item=>{const link=document.createElement("a");link.href=item.url;link.textContent=item.label+" ↗";link.target="_blank";link.rel="noreferrer";answerLinks.append(link);}); answerMedia.replaceChildren(); (entry.images||[]).forEach(item=>{const figure=document.createElement("figure"),img=document.createElement("img"),source=typeof item==="string"?item:item.src;img.src=source;img.alt=typeof item==="string"?"":(item.alt||"");img.loading="lazy";img.decoding="async";figure.append(img);if(typeof item!=="string"&&item.caption){const caption=document.createElement("figcaption");caption.textContent=item.caption;figure.append(caption);}answerMedia.append(figure);});
      previousButton.disabled=activeIndex===0; nextButton.disabled=activeIndex===content.questions.length-1; answerPanel.scrollTop=0; history.replaceState(null,"","#"+entry.id); if(mobileLayout()&&userInitiated){answerSide.classList.add("is-open");document.body.classList.add("panel-open");answerTitle.focus({preventScroll:true});}
    }
    function closeAnswer(){answerSide.classList.remove("is-open");document.body.classList.remove("panel-open");questionButtons.find(button=>button.dataset.questionId===content.questions[activeIndex].id)?.focus();}
    previousButton.addEventListener("click",()=>selectQuestion(activeIndex-1)); nextButton.addEventListener("click",()=>selectQuestion(activeIndex+1)); document.getElementById("close-answer").addEventListener("click",closeAnswer); document.addEventListener("keydown",event=>{if(event.key==="Escape"&&mobileLayout()&&answerSide.classList.contains("is-open"))closeAnswer();});
    const hashEntry=content.questions.findIndex(entry=>entry.id===location.hash.slice(1)); selectQuestion(hashEntry>=0?hashEntry:0);
      })
      .catch(error => {
        document.getElementById("topic-list").textContent = error.message;
      });
  </script>
</body>
</html>
