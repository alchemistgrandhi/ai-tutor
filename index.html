<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Working notes on the questions an AI tutor should be able to answer before deciding how to teach.">
  <title>The questions every AI tutor should answer</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f7f5ef;
      --ink: #171717;
      --muted: #686762;
      --line: #cbc8bf;
      --accent: #2b59c3;
      --accent-soft: #e8edfa;
      --panel: #fbfaf6;
    }

    * { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      background: var(--paper);
    }

    body {
      margin: 0;
      color: var(--ink);
      background:
        linear-gradient(90deg, transparent 0, transparent calc(50% - 35rem), rgba(43, 89, 195, .10) calc(50% - 35rem), rgba(43, 89, 195, .10) calc(50% - 34.94rem), transparent calc(50% - 34.94rem)),
        var(--paper);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 18px;
      line-height: 1.62;
      text-rendering: optimizeLegibility;
    }

    .page {
      width: min(100% - 40px, 1060px);
      margin: 0 auto;
      padding: 34px 0 88px;
    }

    .eyebrow,
    .meta,
    .section-tag,
    .controls button,
    .count,
    footer {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    .eyebrow {
      margin: 0 0 54px;
      color: var(--accent);
      font-size: .72rem;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 235px;
      gap: 78px;
      align-items: end;
      border-bottom: 1px solid var(--ink);
      padding-bottom: 30px;
    }

    h1 {
      max-width: 760px;
      margin: 0;
      font-size: clamp(2.7rem, 7vw, 5.45rem);
      font-weight: 400;
      letter-spacing: -.055em;
      line-height: .96;
    }

    .meta {
      margin: 0 0 4px;
      color: var(--muted);
      font-size: .72rem;
      line-height: 1.55;
    }

    .intro {
      display: grid;
      grid-template-columns: 168px minmax(0, 680px);
      gap: 42px;
      margin: 32px 0 60px;
    }

    .intro .label {
      margin: 5px 0 0;
      color: var(--accent);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: .72rem;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .intro p {
      margin: 0;
      font-size: 1.13rem;
      line-height: 1.55;
    }

    .list-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 12px;
    }

    .count {
      color: var(--muted);
      font-size: .7rem;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .controls {
      display: flex;
      gap: 16px;
    }

    .controls button {
      appearance: none;
      border: 0;
      border-bottom: 1px solid transparent;
      padding: 5px 0;
      color: var(--muted);
      background: transparent;
      font-size: .7rem;
      cursor: pointer;
    }

    .controls button:hover,
    .controls button:focus-visible {
      color: var(--accent);
      border-bottom-color: currentColor;
      outline: none;
    }

    .questions {
      border-top: 1px solid var(--ink);
    }

    details {
      border-bottom: 1px solid var(--line);
      background: transparent;
    }

    details[open] {
      background: var(--panel);
      border-bottom-color: var(--ink);
    }

    summary {
      display: grid;
      grid-template-columns: 64px 1fr 28px;
      gap: 18px;
      align-items: baseline;
      padding: 22px 8px 21px 0;
      cursor: pointer;
      list-style: none;
      font-size: clamp(1.12rem, 2.3vw, 1.45rem);
      line-height: 1.3;
    }

    summary::-webkit-details-marker { display: none; }

    summary:hover .question,
    summary:focus-visible .question {
      color: var(--accent);
    }

    summary:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: -2px;
    }

    .number {
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: .72rem;
    }

    .toggle {
      position: relative;
      width: 18px;
      height: 18px;
      justify-self: end;
      top: 2px;
    }

    .toggle::before,
    .toggle::after {
      content: "";
      position: absolute;
      left: 2px;
      top: 8px;
      width: 14px;
      height: 1px;
      background: currentColor;
    }

    .toggle::after {
      transform: rotate(90deg);
      transition: transform 150ms ease;
    }

    details[open] .toggle::after { transform: rotate(0); }

    .answer {
      display: grid;
      grid-template-columns: 64px minmax(0, 650px) 1fr;
      gap: 18px;
      padding: 0 8px 26px 0;
      animation: reveal 170ms ease-out;
    }

    .answer-copy { grid-column: 2; }

    .section-tag {
      display: inline-block;
      margin-bottom: 10px;
      padding: 2px 7px;
      color: var(--accent);
      background: var(--accent-soft);
      font-size: .65rem;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .answer p { margin: 0; }

    .answer p + p {
      margin-top: 12px;
      color: var(--muted);
      font-size: .92rem;
    }

    .links {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 7px;
      margin-top: 16px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: .72rem;
      line-height: 1.45;
    }

    .links a {
      color: var(--accent);
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    .accordion-media {
      display: grid;
      gap: 18px;
      margin-top: 22px;
    }

    .accordion-media figure { margin: 0; }

    .accordion-media img {
      display: block;
      width: 100%;
      height: auto;
      border: 1px solid var(--line);
      background: #fff;
    }

    .accordion-media figcaption {
      margin-top: 7px;
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: .68rem;
      line-height: 1.5;
    }

    footer {
      display: grid;
      grid-template-columns: 168px minmax(0, 680px);
      gap: 42px;
      margin-top: 62px;
      padding-top: 20px;
      border-top: 1px solid var(--ink);
      color: var(--muted);
      font-size: .72rem;
      line-height: 1.6;
    }

    footer p { margin: 0; }

    @keyframes reveal {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 760px) {
      body { background: var(--paper); }
      .page { width: min(100% - 28px, 1060px); padding-top: 22px; }
      .eyebrow { margin-bottom: 40px; }
      header { grid-template-columns: 1fr; gap: 24px; }
      h1 { font-size: clamp(2.55rem, 13.5vw, 4.4rem); }
      .intro { grid-template-columns: 1fr; gap: 10px; margin: 25px 0 48px; }
      .list-head { align-items: flex-end; }
      .controls { gap: 12px; }
      summary { grid-template-columns: 39px 1fr 21px; gap: 10px; padding: 19px 4px 18px 0; }
      .answer { grid-template-columns: 39px minmax(0, 1fr); gap: 10px; padding: 0 4px 23px 0; }
      .answer-copy { grid-column: 2; }
      footer { grid-template-columns: 1fr; gap: 8px; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .answer { animation: none; }
      .toggle::after { transition: none; }
    }
  </style>
</head>
<body>
  <main class="page">
    <p class="eyebrow" id="page-eyebrow"></p>

    <header>
      <h1 id="page-title"></h1>
      <p class="meta" id="page-meta"></p>
    </header>

    <section class="intro" aria-labelledby="intro-label">
      <p class="label" id="intro-label">The test</p>
      <p id="page-intro"></p>
    </section>

    <div class="list-head">
      <span class="count" id="question-count"></span>
      <div class="controls" aria-label="Accordion controls">
        <button type="button" id="open-all">Open all</button>
        <button type="button" id="close-all">Close all</button>
      </div>
    </div>

    <section class="questions" id="questions" aria-label="Questions for an AI tutor"></section>

    <footer>
      <p>Last revised<br><span id="page-revised"></span></p>
      <p id="page-footer"></p>
    </footer>
  </main>

  <script src="content.js"></script>
  <script>
    const content = window.AI_TUTOR_NOTES;

    document.getElementById('page-eyebrow').textContent = content.eyebrow;
    document.getElementById('page-title').textContent = content.title;
    document.getElementById('page-meta').innerHTML = content.meta;
    document.getElementById('page-intro').textContent = content.intro;
    document.getElementById('page-revised').textContent = content.revised;
    document.getElementById('page-footer').textContent = content.footer;
    document.getElementById('question-count').textContent =
      content.questions.length + (content.questions.length === 1 ? ' question' : ' questions');

    const list = document.getElementById('questions');

    content.questions.forEach((entry, index) => {
      const details = document.createElement('details');
      details.id = entry.id;

      const summary = document.createElement('summary');
      const number = document.createElement('span');
      const question = document.createElement('span');
      const toggle = document.createElement('span');

      number.className = 'number';
      number.textContent = String(index + 1).padStart(2, '0');
      question.className = 'question';
      question.textContent = entry.question;
      toggle.className = 'toggle';
      toggle.setAttribute('aria-hidden', 'true');

      summary.append(number, question, toggle);

      const answer = document.createElement('div');
      const answerCopy = document.createElement('div');
      const tag = document.createElement('span');

      answer.className = 'answer';
      answerCopy.className = 'answer-copy';
      tag.className = 'section-tag';
      tag.textContent = entry.tag;
      answerCopy.append(tag);

      entry.answer.forEach((paragraph) => {
        const p = document.createElement('p');
        p.textContent = paragraph;
        answerCopy.append(p);
      });

      if (entry.links?.length) {
        const links = document.createElement('div');
        links.className = 'links';
        entry.links.forEach((item) => {
          const a = document.createElement('a');
          a.href = item.url;
          a.textContent = item.label;
          a.target = '_blank';
          a.rel = 'noreferrer';
          links.append(a);
        });
        answerCopy.append(links);
      }

      if (entry.images?.length) {
        const media = document.createElement('div');
        media.className = 'accordion-media';

        entry.images.forEach((item) => {
          const figure = document.createElement('figure');
          const img = document.createElement('img');
          img.src = item.src;
          img.alt = item.alt || '';
          img.loading = 'lazy';
          img.decoding = 'async';
          figure.append(img);

          if (item.caption) {
            const caption = document.createElement('figcaption');
            caption.textContent = item.caption;
            figure.append(caption);
          }

          media.append(figure);
        });

        answerCopy.append(media);
      }

      answer.append(answerCopy);
      details.append(summary, answer);
      list.append(details);
    });

    const items = [...document.querySelectorAll('details')];

    document.getElementById('open-all').addEventListener('click', () => {
      items.forEach((item) => { item.open = true; });
    });

    document.getElementById('close-all').addEventListener('click', () => {
      items.forEach((item) => { item.open = false; });
    });

    const openFromHash = () => {
      if (!location.hash) return;
      const item = document.getElementById(location.hash.slice(1));
      if (item?.tagName === 'DETAILS') item.open = true;
    };

    openFromHash();
    window.addEventListener('hashchange', openFromHash);
  </script>
</body>
</html>
