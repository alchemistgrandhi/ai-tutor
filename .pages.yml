media:
  - name: content_images
    label: Note images
    input: images
    output: /ai-tutor/images
    rename: safe
    categories: [image]

actions:
  - name: publish-draft
    label: Publish to website
    workflow: publish-draft.yml
    ref: current
    cancelable: false
    confirm:
      title: Publish draft?
      message: This will move all saved draft changes to the public website.
      button: Publish

content:
  - name: personality
    label: Personality 
    type: file
    path: notes/personality.json
    format: json
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: status
        label: Status
        type: select
        options:
          values: [Researching, Draft, Ready]
      - name: updated
        label: Updated
        type: string
      - name: accent
        label: Highlight colour
        type: select
        options:
          values:
            - name: blue
              label: Blue
            - name: yellow
              label: Yellow
            - name: pink
              label: Pink
            - name: green
              label: Green
      - name: body
        label: Note
        type: rich-text
        required: true
        options:
          format: html
          switcher: true
          media: content_images
          path: personality
          extensions: [jpg, jpeg, png, webp, gif]
          categories: [image]
          rename: safe

  - name: multimodal-content-note
    label: Multimodal content note
    type: file
    path: notes/multimodal-content.json
    format: json
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: status
        label: Status
        type: select
        options:
          values: [Researching, Draft, Ready]
      - name: updated
        label: Updated
        type: string
      - name: accent
        label: Highlight colour
        type: select
        options:
          values:
            - name: blue
              label: Blue
            - name: yellow
              label: Yellow
            - name: pink
              label: Pink
            - name: green
              label: Green
      - name: body
        label: Note
        type: rich-text
        required: true
        options:
          format: html
          switcher: true
          media: content_images
          path: multimodal-content
          extensions: [jpg, jpeg, png, webp, gif]
          categories: [image]
          rename: safe

  - name: tutor-notes
    label: Notes index
    type: file
    path: content.json
    format: json
    fields:
      - name: eyebrow
        label: Small heading
        type: string
      - name: title
        label: Page title
        type: string
        required: true
      - name: meta
        label: Subtitle
        type: text
      - name: intro
        label: Introduction
        type: text
      - name: revised
        label: Last revised
        type: string
      - name: footer
        label: Closing thought
        type: text
      - name: topics
        label: Topics
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: id
            label: ID
            type: string
            required: true
          - name: title
            label: Topic title
            type: string
            required: true
          - name: description
            label: Short description
            type: text
          - name: tags
            label: Question tags
            type: string
            list: true
      - name: questions
        label: Questions
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{question}"
        fields:
          - name: id
            label: ID
            type: string
            required: true
          - name: tag
            label: Topic tag
            type: string
            required: true
          - name: question
            label: Question
            type: text
            required: true
          - name: contentUrl
            label: Note file
            type: string
          - name: answer
            label: Short answer paragraphs
            type: text
            list: true
          - name: links
            label: Links
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{label}"
            fields:
              - name: label
                label: Link text
                type: string
              - name: url
                label: Web address
                type: string
          - name: images
            label: Images
            type: image
            options:
              media: content_images
              multiple:
                max: 12
              extensions: [jpg, jpeg, png, webp, gif]
              rename: safe

settings:
  content:
    merge: true
  commit:
    identity: user
    templates:
      create: "Add {path}"
      update: "Update {path}"
      delete: "Delete {path}"
